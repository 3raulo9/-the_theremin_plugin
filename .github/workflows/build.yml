name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: build\tests\ThereminTests_artefacts\Release\ThereminTests.exe test-output

      - name: VST3 host tests
        run: build\tests\ThereminHostTest_artefacts\Release\ThereminHostTest.exe "build\AetherTheremin_artefacts\Release\VST3\Aether Theremin.vst3"

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build\AetherTheremin_artefacts\Release\VST3\Aether Theremin.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AetherTheremin-Windows-VST3
          path: build/AetherTheremin_artefacts/Release/VST3/

      - uses: actions/upload-artifact@v4
        with:
          name: AetherTheremin-Windows-Standalone
          path: build/AetherTheremin_artefacts/Release/Standalone/*.exe

  macos:
    name: macOS (VST3 + AU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target AetherTheremin_VST3 AetherTheremin_AU ThereminTests

      - name: Unit tests
        run: ./build/tests/ThereminTests_artefacts/Release/ThereminTests test-output

      - uses: actions/upload-artifact@v4
        with:
          name: AetherTheremin-macOS
          path: |
            build/AetherTheremin_artefacts/Release/VST3/
            build/AetherTheremin_artefacts/Release/AU/
